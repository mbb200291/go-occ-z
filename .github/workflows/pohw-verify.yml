# PoHW research prototype: verifies self-attested receipt signatures and source-file hashes.
# Passing this workflow does NOT establish human cognitive authorship.
name: PoHW Receipt Verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: pohw-badge-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Verify signed receipt and code state
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check pinned PoHW verifier code
        shell: bash
        run: |
          echo "688325a77da045b27e2c329404d58f598a143f12b5a721eb4e942dbedafa7f56  .pohw/proof.js" | sha256sum --check --status
          echo "dab23b80585c1371e38b9fc301d49adbbb40dd292703cbd2863d795e6ee802b3  .pohw/verify.cjs" | sha256sum --check --status
      - name: Verify receipt signature and source file content
        run: node .pohw/verify.cjs . "$RUNNER_TEMP/pohw-summary.json"
      - uses: actions/upload-artifact@v4
        with:
          name: pohw-verified-summary
          path: ${{ runner.temp }}/pohw-summary.json
          if-no-files-found: error
  publish:
    name: Publish CI-verified badges
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: pohw-verified-summary
          path: ${{ runner.temp }}/pohw-verified
      - name: Publish verified badge data (separate branch)
        env:
          VERIFIED_FILE: ${{ runner.temp }}/pohw-verified/pohw-summary.json
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git fetch origin pohw-badges; then
            git switch -C pohw-badges-generated FETCH_HEAD
          else
            git switch --orphan pohw-badges-generated
            git rm -rf . >/dev/null
          fi
          cp "$VERIFIED_FILE" summary.json
          git add summary.json
          git commit -m "chore: publish PoHW verified badge data for $GITHUB_SHA"
          git push origin HEAD:refs/heads/pohw-badges
